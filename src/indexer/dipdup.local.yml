spec_version: 3.0

package: maven

database:
  kind: postgres
  host: 127.0.0.1
  port: '5433'
  user: dipdup
  password: dipdup12345
  database: dipdup
  schema_name: public
  connection_timeout: 60

hasura:
  url: http://127.0.0.1:42000
  allow_aggregations: false
  admin_secret: hasura12345
  select_limit: 1000
  rest: false
  http:
    request_timeout: 1200

advanced:
  scheduler:
    apscheduler.job_defaults.coalesce: true
    apscheduler.job_defaults.max_instances: 1
  reindex:
    manual: wipe
    migration: exception
    rollback: ignore
    config_modified: ignore
    schema_modified: wipe

datasources:
  metadata_basenet:
    kind: tzip_metadata
    url: https://basenet.metadata.mavryk.network
    network: oxfordnet
  mvkt_basenet:
    kind: tezos.tzkt
    url: https://basenet.api.mavryk.network
    merge_subscriptions: true
